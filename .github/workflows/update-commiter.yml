name: Update commiter formula

on:
  repository_dispatch:
    types: [commiter-release]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 1.0.1
        required: true
        type: string
      tag:
        description: Release tag, for example v1.0.1
        required: true
        type: string
      url:
        description: darwin/arm64 ZIP URL
        required: true
        type: string
      sha256:
        description: SHA-256 of the darwin/arm64 ZIP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-commiter-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  update:
    name: Update Formula and open PR
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      COMMITER_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      COMMITER_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      COMMITER_URL: ${{ github.event.client_payload.url || inputs.url }}
      COMMITER_SHA256: ${{ github.event.client_payload.sha256 || inputs.sha256 }}
      COMMITER_REPO: neural-int/commiter-cli
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          version="${COMMITER_VERSION}"
          tag="${COMMITER_TAG}"
          url="${COMMITER_URL}"
          sha256="$(printf '%s' "${COMMITER_SHA256}" | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::tag must be v${version}, got ${tag}"
            exit 1
          fi
          if [[ ! "$sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::sha256 must be a 64-character hex digest"
            exit 1
          fi

          expected_url="https://github.com/${COMMITER_REPO}/releases/download/${tag}/commiter_${version}_darwin_arm64.zip"
          if [[ "$url" != "$expected_url" ]]; then
            echo "::error::url must be ${expected_url}"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$expected_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Verify published GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          set -euo pipefail

          is_draft="$(gh release view "$TAG" --repo "$COMMITER_REPO" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::Release $TAG is not published"
            exit 1
          fi

      - name: Verify ZIP SHA-256
        shell: bash
        env:
          URL: ${{ steps.payload.outputs.url }}
          EXPECTED_SHA256: ${{ steps.payload.outputs.sha256 }}
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/commiter.zip"
          curl -fsSL --retry 3 -o "$archive_path" "$URL"
          actual_sha256="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::SHA-256 mismatch: expected ${EXPECTED_SHA256}, got ${actual_sha256}"
            exit 1
          fi

      - name: Update Formula/commiter.rb
        id: formula
        shell: bash
        env:
          VERSION: ${{ steps.payload.outputs.version }}
          URL: ${{ steps.payload.outputs.url }}
          SHA256: ${{ steps.payload.outputs.sha256 }}
        run: |
          set -euo pipefail

          status="$(python3 .github/scripts/update_commiter_formula.py \
            --version "$VERSION" \
            --sha256 "$SHA256" \
            --url "$URL")"

          case "$status" in
            created|updated|unchanged) ;;
            *)
              echo "::error::Unexpected formula update status: ${status}"
              exit 1
              ;;
          esac

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Formula status: $status"

      - name: Skip when Formula is already current
        if: steps.formula.outputs.status == 'unchanged'
        shell: bash
        env:
          TAG: ${{ steps.payload.outputs.tag }}
        run: echo "Formula/commiter.rb already matches ${TAG}"

      - name: Register local tap
        if: steps.formula.outputs.status != 'unchanged'
        shell: bash
        run: |
          set -euo pipefail

          tap_dir="$(brew --repository neural-int/devtools)"
          mkdir -p "$(dirname "$tap_dir")"
          workspace="$(pwd -P)"
          if [[ -e "$tap_dir" || -L "$tap_dir" ]]; then
            current="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$tap_dir")"
            if [[ "$current" != "$workspace" ]]; then
              echo "::error::Tap path ${tap_dir} already exists and is not this workspace"
              exit 1
            fi
          else
            ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"
          fi

      - name: brew audit --strict
        if: steps.formula.outputs.status != 'unchanged'
        shell: bash
        run: brew audit --strict --formula neural-int/devtools/commiter

      - name: brew install
        if: steps.formula.outputs.status != 'unchanged'
        shell: bash
        run: brew install --yes --formula neural-int/devtools/commiter

      - name: brew test
        if: steps.formula.outputs.status != 'unchanged'
        shell: bash
        run: brew test --verbose neural-int/devtools/commiter

      - name: Create or update pull request
        if: steps.formula.outputs.status != 'unchanged'
        shell: bash
        env:
          VERSION: ${{ steps.payload.outputs.version }}
          TAG: ${{ steps.payload.outputs.tag }}
          URL: ${{ steps.payload.outputs.url }}
          SHA256: ${{ steps.payload.outputs.sha256 }}
        run: |
          set -euo pipefail

          branch="automation/commiter-v${VERSION}"
          title="chore: update commiter to ${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add -- Formula/commiter.rb
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Formula update produced no staged diff"
            exit 1
          fi
          git commit -m "$title"

          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "HEAD:${branch}"

          {
            echo "Automated Formula update after [\`${TAG}\`](https://github.com/${COMMITER_REPO}/releases/tag/${TAG}) was published."
            echo
            echo "- URL: \`${URL}\`"
            echo "- SHA-256: \`${SHA256}\`"
            echo
            echo "Verification on this workflow:"
            echo
            echo "- \`brew audit --strict --formula neural-int/devtools/commiter\`"
            echo "- \`brew install --formula neural-int/devtools/commiter\`"
            echo "- \`brew test neural-int/devtools/commiter\`"
            echo
            echo "After merge, users can run:"
            echo
            echo '```sh'
            echo "brew update"
            echo "brew upgrade commiter"
            echo '```'
          } > pr-body.md

          existing_pr="$(gh pr list --head "$branch" --base main --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing PR #${existing_pr}"
            gh pr edit "$existing_pr" --title "$title" --body-file pr-body.md
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file pr-body.md
          fi
